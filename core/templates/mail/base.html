<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;color:#18181b;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:28px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
    {% block body %}{% endblock %}
    <p style="margin-top:28px;padding-top:20px;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;">{{ site_name }}{% if site_tagline %} · {{ site_tagline }}{% endif %}</p>
  </div>
</body>
</html>
